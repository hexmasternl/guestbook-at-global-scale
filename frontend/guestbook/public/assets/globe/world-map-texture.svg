<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" role="img" aria-label="">
  <!--
    Seamless, horizontally-tileable stylized world-map texture used as the
    rotating globe's surface. A single 100x200 pattern tile is repeated four
    times across the 400x200 canvas, so the canvas itself tiles cleanly when
    used with `background-repeat: repeat-x` for a continuous rotation effect.
  -->
  <defs>
    <pattern id="landmasses" width="100" height="200" patternUnits="userSpaceOnUse">
      <ellipse cx="18" cy="60" rx="22" ry="34" fill="#3f8f5f" />
      <ellipse cx="55" cy="40" rx="14" ry="18" fill="#4aa26a" />
      <ellipse cx="70" cy="110" rx="26" ry="20" fill="#3f8f5f" />
      <ellipse cx="30" cy="150" rx="16" ry="24" fill="#4aa26a" />
      <circle cx="90" cy="30" r="6" fill="#5cb37a" />
      <circle cx="8" cy="120" r="5" fill="#5cb37a" />
    </pattern>
  </defs>
  <rect width="400" height="200" fill="#1f6fa8" />
  <rect width="400" height="200" fill="url(#landmasses)" />
</svg>
